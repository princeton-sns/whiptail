syntax = "proto2";

import "common-proto.proto";

package nccstore.proto;

message RequestIDMessage {
    required uint64 client_id = 1;
    required uint64 client_req_id = 2;
}

// Execute request: client sends read/write operations to server
message NCCExecute {
    required RequestIDMessage rid = 1;
    required uint64 tx_id = 2;
    required TimestampMessage tx_ts = 3;  // pre-assigned timestamp
    repeated string read_keys = 4;
    repeated WriteMessage writes = 5;
}

// Read result with (tw, tr) pair
message NCCReadResult {
    required string key = 1;
    required string value = 2;
    required TimestampMessage tw = 3;  // write timestamp of version read
    required TimestampMessage tr = 4;  // read timestamp (equals tx_ts)
}

// Write result with (tw, tr) pair
message NCCWriteResult {
    required string key = 1;
    required TimestampMessage tw = 2;  // write timestamp (equals tx_ts)
    required TimestampMessage tr = 3;  // read timestamp (equals tx_ts)
}

// Execute response: server returns (tw, tr) pairs
message NCCExecuteReply {
    required RequestIDMessage rid = 1;
    // 0 = OK
    // -1 = ABORT (early abort)
    // -2 = RETRY
    required int32 status = 2;
    repeated NCCReadResult reads = 3;
    repeated NCCWriteResult writes = 4;
}

// Commit decision from client to server
message NCCCommit {
    required uint64 tx_id = 1;
    required bool commit = 2;  // true=commit, false=abort
}

// Commit response from server
message NCCCommitReply {
    required uint64 tx_id = 1;
    required int32 status = 2;  // 0=OK, -1=FAIL
}

// Read-only transaction request (optimized protocol)
message NCCReadOnly {
    required RequestIDMessage rid = 1;
    required uint64 tx_id = 2;
    repeated string keys = 3;
    required TimestampMessage snapshot_ts = 4;
}

// Read-only transaction reply
message NCCReadOnlyReply {
    required RequestIDMessage rid = 1;
    required int32 status = 2;
    repeated NCCReadResult reads = 3;
}

// Smart retry request (Algorithm 5.4)
message NCCSmartRetry {
    required RequestIDMessage rid = 1;
    required uint64 tx_id = 2;
    required TimestampMessage new_ts = 3;  // t' in algorithm
    repeated NCCReadResult accessed_reads = 4;   // versions accessed by tx
    repeated NCCWriteResult accessed_writes = 5;
}

// Smart retry reply
message NCCSmartRetryReply {
    required RequestIDMessage rid = 1;
    required bool can_retry = 2;  // true if retry is safe
    optional TimestampMessage tw_max = 3;  // returned for diagnostics
}

// Request wrapper for VR replication
message Request {
    enum Operation {
        EXECUTE = 1;
        COMMIT = 2;
    }
    required Operation op = 1;
    required uint64 txnid = 2;
    optional NCCExecute execute = 3;
    optional NCCCommit commit = 4;
}

// Reply wrapper for VR replication
message Reply {
    // 0 = OK
    // -1 = failed
    // -2 = retry
    required int32 status = 1;
    optional NCCExecuteReply execute_reply = 2;
    optional NCCCommitReply commit_reply = 3;
}

